            background: #161b22;

            border-radius: 8px;
            color: #c9d1d9;

            transition: border-color 0.3s;

        .search-box input::placeholder { color: #484f58; }
        .category {
            margin: 30px 0;
            background: #161b22;
            border-radius: 10px;
            border: 1px solid #30363d;
            overflow: hidden;
        }
        .category-header {
            padding: 15px 20px;
            background: #21262d;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .category-header:hover { background: #30363d; }
        .category-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #58a6ff;
        }
        .category-count {
            background: #30363d;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            color: #8b949e;
        }
        .category-items { padding: 10px; }
        .item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin: 5px 0;
            background: #0d1117;
            border-radius: 6px;
            border: 1px solid #21262d;
            cursor: pointer;
            transition: all 0.2s;
        }
        .item:hover {
            border-color: #58a6ff;
            background: #161b22;
        }
        .item-icon {
            width: 32px;
            height: 32px;
            background: #238636;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 12px;
            flex-shrink: 0;
        }
        .item-icon svg { width: 18px; height: 18px; fill: white; }
        .item-info { flex: 1; }
        .item-name { color: #c9d1d9; font-weight: 500; }
        .item-path { color: #8b949e; font-size: 0.85em; margin-top: 3px; font-family: monospace; }
        .item-badge {
            background: #1f6feb33;
            color: #58a6ff;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            margin-right: 10px;
        }
        .hidden { display: none !important; }
        .no-results {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        footer {
            text-align: center;
            padding: 30px;
            color: #484f58;
            border-top: 1px solid #21262d;
            margin-top: 40px;

        data.forEach(item => {
            const searchText = [item.name, item.cat, item.path, ...item.tags].join(' ').toLowerCase();
            if (!query || searchText.includes(query)) {
                if (!categories[item.cat]) categories[item.cat] = [];
                categories[item.cat].push(item);
            }
        });

        const container = document.getElementById('categories');
        const noResults = document.getElementById('noResults');
        const catNames = Object.keys(categories).sort();

        if (catNames.length === 0) {
            container.innerHTML = '';
            noResults.classList.remove('hidden');
            return;
        }

        noResults.classList.add('hidden');
        let html = '';

        catNames.forEach(cat => {
            const items = categories[cat];
            html += `
                <div class="category">
                    <div class="category-header" onclick="this.parentElement.querySelector('.category-items').classList.toggle('hidden')">
                        <span class="category-title">${cat}</span>
                        <span class="category-count">${items.length}</span>
                    </div>
                    <div class="category-items">
                        ${items.map(item => `
                            <a class="item" href="${githubBase}${item.path}" target="_blank" rel="noopener">
                                <div class="item-icon">
                                    <svg viewBox="0 0 16 16"><path d="M3.75 1.5a.25.25 0 00-.25.25v11.5c0 .138.112.25.25.25h8.5a.25.25 0 00.25-.25V4.664a.25.25 0 00-.073-.177l-2.914-2.914a.25.25 0 00-.177-.073H3.75zM2 1.75C2 .784 2.784 0 3.75 0h5.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0112.25 16h-8.5A1.75 1.75 0 012 14.25V1.75z"/></svg>
                                </div>
                                <div class="item-info">
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-path">${item.path}</div>
                                </div>
                                ${item.tags.slice(0, 2).map(t => `<span class="item-badge">${t}</span>`).join('')}
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        });

        container.innerHTML = html;
    }

    document.getElementById('searchInput').addEventListener('input', render);

    const totalItems = data.length;
    const totalCats = [...new Set(data.map(d => d.cat))].length;
    document.getElementById('totalCount').textContent = totalItems;
    document.getElementById('categoryCount').textContent = totalCats;

    render();
    </script>
</body>
</html>
